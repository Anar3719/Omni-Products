<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBFI · Product OS</title>
<style>
:root{--bg:#fff;--bg2:#f7f7f5;--bg3:#f0efe9;--text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);--green:#639922;--green-bg:#EAF3DE;--green-text:#3B6D11;--blue:#378ADD;--blue-bg:#E6F1FB;--blue-text:#185FA5;--red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;--amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#854F0B;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0efe9;--text2:#a0a09a;--text3:#68685f;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);--green:#7cb342;--green-bg:#24301a;--green-text:#aed581;--blue:#42a5f5;--blue-bg:#162b3d;--blue-text:#90caf9;--red:#ef5350;--red-bg:#331c1c;--red-text:#ef9a9a;--amber:#ffa726;--amber-bg:#332515;--amber-text:#ffe082}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;user-select:none;overflow:hidden}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--text3)}
button{font-family:inherit;font-size:inherit;background:var(--bg3);color:var(--text);border:none;border-radius:var(--r);padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500}
button:hover{filter:brightness(0.95)}
button.primary{background:var(--text);color:var(--bg)}
button.primary:hover{opacity:0.9}
button.danger{background:var(--red-bg);color:var(--red-text)}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.badge.planned{background:var(--bg3);color:var(--text2)}
.badge.active{background:var(--blue-bg);color:var(--blue-text)}
.badge.done{background:var(--green-bg);color:var(--green-text)}
.badge.blocked{background:var(--red-bg);color:var(--red-text)}
.badge.tag{background:var(--bg2);color:var(--text2);text-transform:none;font-weight:normal}
#app{display:grid;grid-template-columns:260px 1px 1px 1px 1fr;height:100vh;width:100vw;position:relative}
#sidebar{background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.sb-header{padding:16px;display:flex;align-items:center;justify-content:between;border-bottom:1px solid var(--border);gap:8px}
.sb-title{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-search-box{padding:10px 16px;border-bottom:1px solid var(--border)}
.sb-search-box input{width:100%}
.sb-nav{flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-weight:500}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--bg3);color:var(--text);font-weight:600}
.sb-item svg{width:16px;height:16px;opacity:0.7}
.sb-section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;padding:12px 10px 4px 10px}
#main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:53px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg);gap:12px;z-index:10}
.topbar-title{font-weight:600;font-size:16px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content-area{flex:1;overflow-y:auto;padding:24px;position:relative}
.view-pane{display:none;height:100%}
.view-pane.active{display:block}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:box-shadow 0.1s}
.card:hover{box-shadow:0 4px 12px var(--border);border-color:var(--border2)}
.card-header{display:flex;align-items:start;justify-content:space-between;gap:8px}
.card-title{font-weight:600;font-size:15px;line-height:1.3}
.card-desc{color:var(--text2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text3);margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
.card-tags{display:flex;flex-wrap:wrap;gap:4px}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
.detail-main{display:flex;flex-direction:column;gap:20px}
.detail-side{background:var(--bg2);border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--border)}
.section-heading{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.kv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv-row:last-child{border:none}
.kv-label{color:var(--text2)}
.kv-val{font-weight:500;text-align:right}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:center;gap:10px;background:var(--bg2);padding:10px 12px;border-radius:var(--r);border:1px solid var(--border);cursor:pointer}
.task-item:hover{border-color:var(--border2)}
.task-text{flex:1;font-size:13px}
.task-text.done{text-decoration:line-through;color:var(--text3)}
.road-swimlanes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:100%;align-items:start}
.swimlane{background:var(--bg2);border-radius:var(--rl);padding:12px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto;border:1px solid var(--border)}
.swimlane-header{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.swimlane-title{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2)}
.swimlane-count{background:var(--bg3);color:var(--text2);padding:2px 6px;border-radius:10px;font-size:11px;font-weight:600}
.road-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:13px}
.road-card:hover{border-color:var(--border2);box-shadow:0 2px 6px var(--border)}
.road-pname{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase}
.road-title{font-weight:500}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg);border-radius:var(--rl);width:100%;max-width:500px;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,0.15);border:1px solid var(--border);overflow:hidden}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between}
.modal-title{font-weight:600;font-size:16px}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:70vh}
.modal-footer{padding:12px 20px;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:end;gap:8px}
.f-group{display:flex;flex-direction:column;gap:6px}
.f-group label{font-size:12px;font-weight:600;color:var(--text2)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--text3);gap:12px}
.empty-state svg{width:48px;height:48px;opacity:0.5}
.setting-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.setting-info{flex:1}
.setting-title{font-weight:600;font-size:14px;margin-bottom:2px}
.setting-desc{font-size:13px;color:var(--text2)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sb-header">
      <svg viewBox="0 0 24 24" style="color:var(--blue)"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <div class="sb-title">NBFI · Product OS</div>
    </div>
    <div class="sb-search-box">
      <input type="text" id="sb_search" placeholder="Search everywhere..." oninput="window.doSearch(this.value)">
    </div>
    <div class="sb-nav">
      <div class="sb-item active" id="sb_tab_all" onclick="window.setTab('all')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>All Projects</span>
      </div>
      <div class="sb-item" id="sb_tab_road" onclick="window.setTab('road')">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        <span>Roadmap Lanes</span>
      </div>
      <div class="sb-section-title">Types</div>
      <div class="sb-item" id="sb_tab_t_customer" onclick="window.setTab('t_customer')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Customer Facing</span>
      </div>
      <div class="sb-item" id="sb_tab_t_internal" onclick="window.setTab('t_internal')">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>Internal Tools</span>
      </div>
      <div class="sb-item" id="sb_tab_t_core" onclick="window.setTab('t_core')">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
        <span>Core Engine / Infra</span>
      </div>
      <div class="sb-section-title">System</div>
      <div class="sb-item" id="sb_tab_settings" onclick="window.setTab('settings')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Data & Settings</span>
      </div>
    </div>
  </div>
  <div style="width:0px;border:none"></div><div style="width:0px;border:none"></div><div style="width:0px;border:none"></div>
  <div id="main">
    <div class="topbar">
      <div class="topbar-title" id="view_title">Projects</div>
      <div class="topbar-actions" id="view_actions"></div>
    </div>
    <div class="content-area" id="content_scroll">
      <div id="v_all" class="view-pane"></div>
      <div id="v_road" class="view-pane"></div>
      <div id="v_project" class="view-pane"></div>
      <div id="v_settings" class="view-pane"></div>
    </div>
  </div>
</div>
<div id="modal_overlay" class="modal-overlay" onclick="if(event.target===this)window.closeModal()">
  <div class="modal" id="modal_holder"></div>
</div>
<input type="file" id="import_file_input" style="display:none" accept=".json" onchange="window.handleImportFile(event)">
<script>
(function(){
  const $=id=>document.getElementById(id);
  window.D={projects:{},tasks:{},road:{},conns:{}};
  window.ui={tab:'all',gview:'list',sel:null,search:''};
  const def_p={
    'p1':{id:'p1',name:'Core Banking API V2',local:'HQ-Core',type:'core',status:'active',desc:'Upgrading transaction processing system for high throughput ledger settlement and concurrent lock mitigation.',tags:['infra','speed']},
    'p2':{id:'p2',name:'Merchant Portal Dashboard',local:'UB-Office',type:'customer',status:'active',desc:'Re-designing statements extraction, clearing reconciliation tools, and instant settlement widgets for SME nodes.',tags:['frontend','fintech']},
    'p3':{id:'p3',name:'E-KYC Face Verification',local:'Remote-Node',type:'customer',status:'planned',desc:'Integrating localized identity provider liveness streams to reduce manual verification queues.',tags:['security','biometric']},
    'p4':{id:'p4',name:'Automated Credit Scoring',local:'HQ-Risk',type:'core',status:'done',desc:'Decision engine node wiring machine learning data buckets with social ledger footprints.',tags:['risk','ml']},
    'p5':{id:'p5',name:'Internal Audit Logging Engine',local:'HQ-Compliance',type:'internal',status:'blocked',desc:'Immutable ledger log pipe for capturing operator session snapshots across high privilege zones.',tags:['compliance','audit']}
  };
  const def_t={
    't1':{id:'t1',p:'p1',text:'Database schema structure migrations and index benchmarking',done:true},
    't2':{id:'t2',p:'p1',text:'Kafka cluster routing stream pipe load stress tests',done:false},
    't3':{id:'t3',p:'p2',text:'Exportable XLSX statement parsing optimization',done:true},
    't4':{id:'t4',p:'p2',text:'Websocket channel connection drop retry timers',done:false},
    't5':{id:'t5',p:'p3',text:'Camera framing alignment guides and baseline latency filters',done:false}
  };
  const def_r={
    'r1':{id:'r1',p:'p1',lane:'q1',title:'Database Schema Migrations & Benchmarking'},
    'r2':{id:'r2',p:'p1',lane:'q2',title:'Kafka Cluster Routing & Stress Testing'},
    'r3':{id:'r3',p:'p2',lane:'q1',title:'Reconciliation Pipeline UI & Statements'},
    'r4':{id:'r4',p:'p3',lane:'q3',title:'Liveness SDK Pipeline Wiring'},
    'r5':{id:'r5',p:'p4',lane:'done',title:'Decision Tree Risk Model Rollout'},
    'r6':{id:'r6',p:'p5',lane:'q2',title:'Audit Log Mirror Pipe Initialization'}
  };
  window.initDB=function(){
    try{
      if(localStorage.getItem('nbfi_pos_p')){
        window.D.projects=JSON.parse(localStorage.getItem('nbfi_pos_p')||'{}');
        window.D.tasks=JSON.parse(localStorage.getItem('nbfi_pos_t')||'{}');
        window.D.road=JSON.parse(localStorage.getItem('nbfi_pos_r')||'{}');
        window.D.conns=JSON.parse(localStorage.getItem('nbfi_pos_c')||'{}');
      }else{
        window.D.projects=def_p;window.D.tasks=def_t;window.D.road=def_r;window.D.conns={};
        window.save();
      }
    }catch(e){
      window.D.projects=def_p;window.D.tasks=def_t;window.D.road=def_r;window.D.conns={};
    }
  };
  window.save=function(){
    localStorage.setItem('nbfi_pos_p',JSON.stringify(window.D.projects));
    localStorage.setItem('nbfi_pos_t',JSON.stringify(window.D.tasks));
    localStorage.setItem('nbfi_pos_r',JSON.stringify(window.D.road));
    localStorage.setItem('nbfi_pos_c',JSON.stringify(window.D.conns));
  };
  window.exportJSON=function(){
    const pwd = prompt('Введите пароль для экспорта (Password required):');
    if(pwd !== '425879'){
      alert('Неверный пароль! / Буруу нууц үг!');
      return;
    }
    const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(window.D,null,2));
    const dlAnchor=document.createElement('a');
    dlAnchor.setAttribute("href",dataStr);
    dlAnchor.setAttribute("download","nbfi_product_os_backup.json");
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
  };
  window.triggerImport=function(){
    const pwd = prompt('Введите пароль для импорта (Password required):');
    if(pwd !== '425879'){
      alert('Неверный пароль! / Буруу нууц үг!');
      return;
    }
    $('import_file_input').click();
  };
  window.handleImportFile=function(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(evt){
      try{
        const parsed=JSON.parse(evt.target.result);
        if(parsed.projects && parsed.tasks && parsed.road){
          window.D=parsed;
          window.save();
          alert('Data imported successfully.');
          window.render();
        }else{alert('Invalid JSON structure.');}
      }catch(err){alert('Error parsing file.');}
    };
    reader.readAsText(file);
    e.target.value='';
  };
  window.setTab=function(tabId){
    window.ui.tab=tabId;
    if(tabId==='road'){window.ui.gview='road';window.ui.sel=null;}
    else if(tabId==='settings'){window.ui.gview='settings';window.ui.sel=null;}
    else{window.ui.gview='list';window.ui.sel=null;}
    document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
    const targeted=$('sb_tab_'+tabId);if(targeted)targeted.classList.add('active');
    window.render();
  };
  window.doSearch=function(val){window.ui.search=(val||'').trim().toLowerCase();window.render();};
  window.openModal=function(html){$('modal_holder').innerHTML=html;$('modal_overlay').classList.add('active');};
  window.closeModal=function(){$('modal_overlay').classList.remove('active');$('modal_holder').innerHTML='';};
  window.addProjectModal=function(){
    const html=`
      <div class="modal-header"><div class="modal-title">Create New Project</div></div>
      <div class="modal-body">
        <div class="f-group"><label>Project Unique ID *</label><input type="text" id="m_id" placeholder="e.g. p6"></div>
        <div class="f-group"><label>Project Name *</label><input type="text" id="m_name" placeholder="Title line..."></div>
        <div class="f-row">
          <div class="f-group"><label>Localization / Squad</label><input type="text" id="m_local" placeholder="e.g. HQ-Fin"></div>
          <div class="f-group"><label>Strategic Bucket</label>
            <select id="m_type">
              <option value="customer">Customer Facing</option>
              <option value="internal">Internal Tools</option>
              <option value="core">Core Engine / Infra</option>
            </select>
          </div>
        </div>
        <div class="f-group"><label>Scope Objective / Description</label><textarea id="m_desc" rows="3" placeholder="Context metrics..."></textarea></div>
        <div class="f-group"><label>Tags (Comma separated)</label><input type="text" id="m_tags" placeholder="speed, security"></div>
      </div>
      <div class="modal-footer">
        <button onclick="window.closeModal()">Cancel</button>
        <button class="primary" onclick="window.submitNewProject()">Create Project</button>
      </div>`;
    window.openModal(html);
  };
  window.submitNewProject=function(){
    const id=(($('m_id')?$('m_id').value:'').trim().toLowerCase());const name=(($('m_name')?$('m_name').value:'').trim());const local=(($('m_local')?$('m_local').value:'').trim());
    const type=$('m_type')?$('m_type').value:'customer';const desc=(($('m_desc')?$('m_desc').value:'').trim());const tagsInp=$('m_tags')?$('m_tags').value:'';
    if(!id||!name){alert('ID and Name required.');return;}
    const tags=tagsInp.split(',').map(t=>t.trim()).filter(t=>t);
    if(!window.D.projects)window.D.projects={};window.D.projects[id]={id,name,local,type,status:'planned',desc,tags};
    window.ui.sel=id;window.ui.gview='project';window.save();window.closeModal();window.render();
  };
  window.submitDelProject=function(pid){
    if(window.D.projects[pid])delete window.D.projects[pid];
    Object.values(window.D.tasks||{}).forEach(t=>{if(t.p===pid)delete window.D.tasks[t.id];});
    Object.values(window.D.road||{}).forEach(r=>{if(r.p===pid)delete window.D.road[r.id];});
    Object.values(window.D.conns||{}).forEach(c=>{if(c.fp===pid||c.tp===pid)delete window.D.conns[c.id];});
    window.ui.sel=null;window.ui.gview='list';window.save();window.closeModal();window.render();
  };
  window.editProjectModal=function(pid){
    const p=window.D.projects[pid];if(!p)return;
    const html=`
      <div class="modal-header"><div class="modal-title">Edit: ${p.name}</div></div>
      <div class="modal-body">
        <div class="f-group"><label>Project Name *</label><input type="text" id="me_name" value="${p.name}"></div>
        <div class="f-row">
          <div class="f-group"><label>Localization / Squad</label><input type="text" id="me_local" value="${p.local||''}"></div>
          <div class="f-group"><label>Status State</label>
            <select id="me_status">
              <option value="planned" ${p.status==='planned'?'selected':''}>Planned</option>
              <option value="active" ${p.status==='active'?'selected':''}>Active Tracking</option>
              <option value="done" ${p.status==='done'?'selected':''}>Done / Shipped</option>
              <option value="blocked" ${p.status==='blocked'?'selected':''}>Blocked</option>
            </select>
          </div>
        </div>
        <div class="f-group"><label>Scope Objective</label><textarea id="me_desc" rows="3">${p.desc||''}</textarea></div>
        <div class="f-group"><label>Tags (Comma separated)</label><input type="text" id="me_tags" value="${(p.tags||[]).join(', ')}"></div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="danger" onclick="if(confirm('Delete entire project and its structural items?'))window.submitDelProject('${p.id}')">Delete</button>
        <div style="display:flex;gap:8px">
          <button onclick="window.closeModal()">Cancel</button>
          <button class="primary" onclick="window.submitEditProject('${p.id}')">Save Changes</button>
        </div>
      </div>`;
    window.openModal(html);
  };
  window.submitEditProject=function(pid){
    const p=window.D.projects[pid];if(!p)return;
    p.name=(($('me_name')?$('me_name').value:'').trim());p.local=(($('me_local')?$('me_local').value:'').trim());
    p.status=$('me_status')?$('me_status').value:'planned';p.desc=(($('me_desc')?$('me_desc').value:'').trim());
    const tagsInp=$('me_tags')?$('me_tags').value:'';p.tags=tagsInp.split(',').map(t=>t.trim()).filter(t=>t);
    window.save();window.closeModal();window.render();
  };
  window.addTask=function(pid){
    const txt=prompt('Enter scope chunk checklist objective:');if(!txt||!txt.trim())return;
    const id='t_'+Date.now();
    if(!window.D.tasks)window.D.tasks={};window.D.tasks[id]={id,p:pid,text:txt.trim(),done:false};
    window.save();window.render();
  };
  window.toggleTask=function(tid){
    if(window.D.tasks[tid])window.D.tasks[tid].done=!window.D.tasks[tid].done;
    window.save();window.render();
  };
  window.delTask=function(tid){
    if(window.D.tasks[tid])delete window.D.tasks[tid];
    window.save();window.render();
  };
  window.addRoadItem=function(lane){
    const pids=Object.keys(window.D.projects);
    if(!pids.length){alert('Create a project hub anchor node first.');return;}
    let opts=pids.map(id=>`<option value="${id}">${window.D.projects[id].name}</option>`).join('');
    const html=`
      <div class="modal-header"><div class="modal-title">Add Roadmap Lane Epic</div></div>
      <div class="modal-body">
        <div class="f-group"><label>Parent Project Anchor</label><select id="mr_pid">${opts}</select></div>
        <div class="f-group"><label>Epic Item Title</label><input type="text" id="mr_title" placeholder="Deliverable slice target..."></div>
        <input type="hidden" id="mr_lane" value="${lane}">
      </div>
      <div class="modal-footer">
        <button onclick="window.closeModal()">Cancel</button>
        <button class="primary" onclick="window.submitRoadItem()">Add to Roadmap</button>
      </div>`;
    window.openModal(html);
  };
  window.submitRoadItem=function(){
    const p=$('mr_pid').value;const title=(($('mr_title')?$('mr_title').value:'').trim());const lane=$('mr_lane').value;
    if(!title){alert('Epic title context needed.');return;}
    const id='r_'+Date.now();
    if(!window.D.road)window.D.road={};window.D.road[id]={id,p,lane,title};
    window.save();window.closeModal();window.render();
  };
  window.editRoadItem=function(rid){
    const r=window.D.road[rid];if(!r)return;
    const html=`
      <div class="modal-header"><div class="modal-title">Edit Epic Track Placement</div></div>
      <div class="modal-body">
        <div class="f-group"><label>Epic Item Title</label><input type="text" id="mre_title" value="${r.title}"></div>
        <div class="f-group"><label>Roadmap Target Quarter</label>
          <select id="mre_lane">
            <option value="q1" ${r.lane==='q1'?'selected':''}>Q1 Target Window</option>
            <option value="q2" ${r.lane==='q2'?'selected':''}>Q2 Target Window</option>
            <option value="q3" ${r.lane==='q3'?'selected':''}>Q3 Target Window</option>
            <option value="done" ${r.lane==='done'?'selected':''}>Completed Track / Archive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="danger" onclick="delete window.D.road['${r.id}'];window.save();window.closeModal();window.render();">Delete Epic</button>
        <div style="display:flex;gap:8px">
          <button onclick="window.closeModal()">Cancel</button>
          <button class="primary" onclick="window.D.road['${r.id}'].title=$('mre_title').value;window.D.road['${r.id}'].lane=$('mre_lane').value;window.save();window.closeModal();window.render();">Update</button>
        </div>
      </div>`;
    window.openModal(html);
  };
  window.render=function(){
    document.querySelectorAll('.view-pane').forEach(el=>el.classList.remove('active'));
    const t_scroll=$('content_scroll');if(t_scroll)t_scroll.scrollTop=0;
    let titleText="Projects Hub";
    let actionsHtml=`<button class="primary" onclick="window.addProjectModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Project</button>`;
    if(window.ui.gview==='list'){
      $('v_all').classList.add('active');
      let filtered=Object.values(window.D.projects);
      if(window.ui.tab.startsWith('t_')){
        const targetType=window.ui.tab.substring(2);
        filtered=filtered.filter(p=>p.type===targetType);
        titleText=(targetType==='customer'?'Customer Facing Nodes':targetType==='internal'?'Internal Infrastructure':'Core Layer Matrix');
      }else{titleText="All Registered Projects";}
      if(window.ui.search){
        filtered=filtered.filter(p=>(p.name||'').toLowerCase().includes(window.ui.search)||(p.desc||'').toLowerCase().includes(window.ui.search)||(p.local||'').toLowerCase().includes(window.ui.search));
      }
      if(!filtered.length){
        $('v_all').innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg><div>No active trace found matching selection matrix parameters.</div></div>`;
      }else{
        let cards=filtered.map(p=>{
          const tArr=Object.values(window.D.tasks||{}).filter(t=>t.p===p.id);
          const finishedCount=tArr.filter(t=>t.done).length;
          const tagsHtml=(p.tags||[]).map(t=>`<span class="badge tag">${t}</span>`).join('');
          return `
            <div class="card" onclick="window.ui.gview='project';window.ui.sel='${p.id}';window.render()">
              <div class="card-header">
                <span class="badge ${p.status}">${p.status}</span>
                <span style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase">${p.local||'Unassigned'}</span>
              </div>
              <div class="card-title">${p.name}</div>
              <div class="card-desc">${p.desc||'No overview documentation defined for this node record.'}</div>
              <div class="card-tags">${tagsHtml}</div>
              <div class="card-meta">
                <span>Type: <strong style="text-transform:capitalize">${p.type}</strong></span>
                <span>${finishedCount}/${tArr.length} Checkpoints</span>
              </div>
            </div>`;
        }).join('');
        $('v_all').innerHTML=`<div class="grid-cards">${cards}</div>`;
      }
    }else if(window.ui.gview==='project'){
      $('v_project').classList.add('active');
      const p=window.D.projects[window.ui.sel];
      if(!p){window.ui.gview='list';window.render();return;}
      titleText=`Project: ${p.id}`;
      actionsHtml=`
        <button onclick="window.ui.gview='list';window.render()"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Back</button>
        <button class="primary" onclick="window.editProjectModal('${p.id}')"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Configure Node</button>`;
      const pTasks=Object.values(window.D.tasks||{}).filter(t=>t.p===p.id);
      let tListHtml=pTasks.map(t=>`
        <div class="task-item">
          <input type="checkbox" ${t.done?'checked':''} onclick="event.stopPropagation();window.toggleTask('${t.id}')">
          <div class="task-text ${t.done?'done':''}" onclick="window.toggleTask('${t.id}')">${t.text}</div>
          <button style="padding:4px 6px;background:transparent" onclick="event.stopPropagation();if(confirm('Drop milestone?'))window.delTask('${t.id}')">×</button>
        </div>`).join('');
      if(!tListHtml)tListHtml=`<div class="empty-state" style="padding:20px">No verification steps loaded for this project segment footprint.</div>`;
      const roadmapEpics=Object.values(window.D.road||{}).filter(r=>r.p===p.id);
      let rLinkedHtml=roadmapEpics.map(r=>`<div class="road-card" onclick="window.editRoadItem('${r.id}')"><div class="road-pname">${r.lane.toUpperCase()} Timeline</div><div class="road-title">${r.title}</div></div>`).join('');
      if(!rLinkedHtml)rLinkedHtml=`<div style="font-size:12px;color:var(--text3);text-align:center;padding:10px;background:var(--bg2);border-radius:var(--r);border:1px dashed var(--border)">Not currently referenced on any system roadmap timelines.</div>`;
      $('v_project').innerHTML=`
        <div class="detail-grid">
          <div class="detail-main">
            <div>
              <h2 style="font-size:22px;font-weight:700;margin-bottom:6px;line-height:1.2">${p.name}</h2>
              <div style="display:flex;gap:6px;align-items:center;margin-bottom:16px">
                <span class="badge ${p.status}">${p.status}</span>
                <span class="badge tag">${p.type}</span>
                <span style="font-size:12px;color:var(--text3);margin-left:4px">Location Vector: <strong>${p.local||'Unknown Zone'}</strong></span>
              </div>
              <p style="font-size:15px;color:var(--text2);line-height:1.5;background:var(--bg2);padding:14px;border-radius:var(--rl);border:1px solid var(--border)">${p.desc||'No description outline has been documented for this deployment trace objective.'}</p>
            </div>
            <div>
              <div class="section-heading"><span>Scope Milestones & Checkpoints</span><button style="padding:4px 8px;font-size:12px" onclick="window.addTask('${p.id}')">+ Add Step</button></div>
              <div class="task-list">${tListHtml}</div>
            </div>
          </div>
          <div class="detail-side">
            <div>
              <div class="section-heading">Telemetry Ledger</div>
              <div class="kv-row"><div class="kv-label">Node Unique Identifier</div><div class="kv-val" style="font-family:monospace">${p.id}</div></div>
              <div class="kv-row"><div class="kv-label">Sub-System Pipeline</div><div class="kv-val" style="text-transform:capitalize">${p.type}</div></div>
              <div class="kv-row"><div class="kv-label">Milestone Checkpoints</div><div class="kv-val">${pTasks.filter(t=>t.done).length} / ${pTasks.length}</div></div>
            </div>
            <div>
              <div class="section-heading">Roadmap Placements</div>
              <div style="display:flex;flex-direction:column;gap:8px">${rLinkedHtml}</div>
            </div>
          </div>
        </div>`;
    }else if(window.ui.gview=='road'){
      $('v_road').classList.add('active');
      titleText="Roadmap Epic Matrix";
      actionsHtml=`<span style="font-size:12px;color:var(--text3);font-weight:500">Cross-Project Delivery Streams</span>`;
      const lanes=['q1','q2','q3','done'];
      const laneNames={q1:'Q1 Delivery','q2':'Q2 Delivery','q3':'Q3 Delivery','done':'Shipped / Archive'};
      let swimlanesHtml=lanes.map(lId=>{
        let epics=Object.values(window.D.road||{}).filter(r=>r.lane===lId);
        if(window.ui.search){epics=epics.filter(e=>(e.title||'').toLowerCase().includes(window.ui.search));}
        let cardsHtml=epics.map(e=>{
          const p=window.D.projects[e.p]||{name:'Broken Anchor Node',type:'core'};
          return `<div class="road-card" onclick="window.editRoadItem('${e.id}')"><div class="road-pname">${p.name}</div><div class="road-title">${e.title}</div></div>`;
        }).join('');
        return `
          <div class="swimlane">
            <div class="swimlane-header">
              <span class="swimlane-title">${laneNames[lId]}</span>
              <span class="swimlane-count">${epics.length}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1">${cardsHtml}</div>
            <button style="width:100%;justify-content:center;margin-top:4px;font-size:12px;padding:4px" onclick="window.addRoadItem('${lId}')">+ Add Epic</button>
          </div>`;
      }).join('');
      $('v_road').innerHTML=`<div class="road-swimlanes">${swimlanesHtml}</div>`;
    }else if(window.ui.gview=='settings'){
      $('v_settings').classList.add('active');
      titleText="Data Management Matrix";
      actionsHtml=`<span style="font-size:12px;color:var(--text3)">Pipeline Engine Active</span>`;
      $('v_settings').innerHTML=`
        <div style="max-width:600px">
          <div class="setting-card">
            <div class="setting-row">
              <div class="setting-info">
                <div class="setting-title">Export Operations Snapshot (JSON)</div>
                <div class="setting-desc">Downloads a full state package file representing all active pipelines, architectural records, track epics, and checklists.</div>
              </div>
              <button class="primary" onclick="window.exportJSON()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export JSON</button>
            </div>
          </div>
          <div class="setting-card">
            <div class="setting-row">
              <div class="setting-info">
                <div class="setting-title">Import Operations Snapshot (JSON)</div>
                <div class="setting-desc">Overwrites current runtime database structures with an external saved schema snapshot file. Warning: this step removes untracked sessions.</div>
              </div>
              <button onclick="window.triggerImport()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Import JSON</button>
            </div>
          </div>
        </div>`;
    }
    if($('view_title'))$('view_title').innerText=titleText;if($('view_actions'))$('view_actions').innerHTML=actionsHtml;
  };
  window.initDB();window.render();
})();
</script>
</body>
</html>
