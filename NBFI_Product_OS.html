<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBFI · Product OS</title>
<style>
:root{--bg:#fff;--bg2:#f7f7f5;--bg3:#f0efe9;--text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);--green:#639922;--green-bg:#EAF3DE;--green-text:#3B6D11;--blue:#378ADD;--blue-bg:#E6F1FB;--blue-text:#185FA5;--red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;--amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#854F0B;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0efe9;--text2:#a0a09a;--text3:#68685f;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--green-bg:#1a2e0a;--green-text:#97C459;--blue-bg:#0a1e35;--blue-text:#85B7EB;--red-bg:#2e0a0a;--red-text:#F09595;--amber-bg:#2e1e0a;--amber-text:#EF9F27}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-size:14px;font-weight:600;color:var(--text)}.brand span{font-weight:400;color:var(--text3)}
.spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--r);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap}
.tbtn:hover,.tbtn.on{background:var(--bg);color:var(--text)}
.tbtn.prim{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.tbtn.prim:hover{opacity:.9}
.team-bar{padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tlbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0}
.mchip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text2);background:var(--bg)}
.mchip button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;line-height:1;padding:0}
.mchip button:hover{color:var(--red)}
.minp{font-size:12px;border:1px solid var(--border2);border-radius:var(--r);padding:4px 8px;background:var(--bg);color:var(--text);outline:none;width:120px}
.layout{display:flex;flex:1;overflow:hidden}
.sb{width:185px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg2)}
.sb-head{padding:12px 13px 9px;border-bottom:1px solid var(--border)}
.sb-org{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.09em}
.sb-title{font-size:15px;font-weight:600;color:var(--text);margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 0 6px}
.sb-sec{font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 3px;display:flex;align-items:center;justify-content:space-between}
.sb-add{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;line-height:1;padding:0}
.sb-add:hover{color:var(--text)}
.pitem{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;border-radius:6px;margin:1px 5px;position:relative}
.pitem:hover{background:var(--bg)}.pitem.on{background:var(--bg);font-weight:600}
.pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--text2)}
.pitem.on .pname{color:var(--text)}
.pitem-act{display:none;gap:2px}
.pitem:hover .pitem-act{display:flex}
.piabtn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;padding:2px 3px;border-radius:4px;line-height:1}
.piabtn:hover{background:var(--bg3);color:var(--text)}.piabtn.del:hover{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dl{background:var(--green)}.dp{background:var(--blue)}.db{background:var(--red)}.dpl{background:var(--amber)}
.pcnt{font-size:10px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:0 5px;min-width:18px;text-align:center;flex-shrink:0}
.sb-foot{border-top:1px solid var(--border);padding:5px}
.gbtn{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:13px;color:var(--text2);cursor:pointer;border-radius:6px}
.gbtn:hover,.gbtn.on{background:var(--bg);color:var(--text);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.phdr{padding:13px 18px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.ptrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pt{font-size:18px;font-weight:700;color:var(--text)}
.plocal{font-size:13px;color:var(--text3);font-weight:400}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600;cursor:pointer;position:relative}
.bl{background:var(--green-bg);color:var(--green-text)}.bp{background:var(--blue-bg);color:var(--blue-text)}.bb{background:var(--red-bg);color:var(--red-text)}.bpl{background:var(--amber-bg);color:var(--amber-text)}
.ptype{font-size:12px;color:var(--text3);margin-left:auto}
.smenu{position:absolute;top:calc(100% + 4px);left:0;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:4px;z-index:100;min-width:130px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.sopt{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12px;cursor:pointer;border-radius:5px;color:var(--text2)}
.sopt:hover{background:var(--bg2)}
.pmeta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px;padding:7px 10px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--border)}
.pmeta-g{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pmeta-l{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pmeta-v{font-size:12px;color:var(--text);font-weight:500}
.pmeta-c{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.pmeta-sep{width:1px;height:14px;background:var(--border2);flex-shrink:0}
.tabs{display:flex}
.tab{padding:8px 13px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.mbody{flex:1;overflow-y:auto;padding:15px 18px}
.tmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--text3)}
.clr{background:none;border:none;font-size:11px;color:var(--text3);cursor:pointer;padding:0}
.clr:hover{color:var(--text2);text-decoration:underline}
.prog{height:3px;background:var(--bg3);border-radius:999px;margin-bottom:11px;overflow:hidden}
.pfill{height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.ar{display:flex;gap:6px;margin-bottom:11px}
.ar input,.ar select{font-size:13px;border:1px solid var(--border2);border-radius:var(--r);padding:7px 9px;background:var(--bg2);color:var(--text);outline:none}
.ar input{flex:1}.ar select{max-width:125px}
.ar input:focus,.ar select:focus{border-color:var(--blue)}
.ar button{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:7px 11px;border:1px solid var(--border2);border-radius:var(--r);background:transparent;color:var(--text);cursor:pointer;flex-shrink:0}
.ar button:hover{background:var(--bg2)}
.tlist{display:flex;flex-direction:column;gap:4px}
.titem{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--r);border:1px solid transparent}
.titem:hover{border-color:var(--border)}
.chk{width:16px;height:16px;border-radius:4px;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk.ck{background:var(--green);border-color:var(--green)}
.chk.ck::after{content:'';width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.ttxt{flex:1;font-size:13px;color:var(--text);line-height:1.4}
.ttxt.dn{color:var(--text3);text-decoration:line-through}
.atag{font-size:11px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:2px 7px;white-space:nowrap}
.xbtn{background:none;border:none;font-size:15px;color:var(--text3);cursor:pointer;opacity:0;flex-shrink:0;line-height:1;padding:0}
.titem:hover .xbtn{opacity:1}.xbtn:hover{color:var(--red)}
.donesec{margin-top:11px;border-top:1px solid var(--border);padding-top:9px}
.dnhdr{font-size:12px;color:var(--text3);margin-bottom:6px}
.muted{font-size:13px;color:var(--text3);padding:6px 0}
.rcols{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.rcol{background:var(--bg2);border-radius:var(--rl);padding:11px}
.rch{display:flex;align-items:center;gap:5px;margin-bottom:9px}
.rct{font-size:13px;font-weight:600;color:var(--text)}
.rcc{font-size:11px;color:var(--text3);background:var(--bg);border-radius:999px;padding:1px 6px;border:1px solid var(--border)}
.rlist{min-height:28px;display:flex;flex-direction:column;gap:4px;margin-bottom:7px}
.rcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:6px 8px;font-size:12px;color:var(--text);display:flex;align-items:flex-start;gap:3px;line-height:1.5}
.rcard-t{flex:1;min-width:0;word-break:break-word}
.mvb,.rxb{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;opacity:0;flex-shrink:0;line-height:1.5;padding:0}
.rcard:hover .mvb,.rcard:hover .rxb{opacity:.7}
.mvb:hover{opacity:1!important;color:var(--text)}.rxb:hover{opacity:1!important;color:var(--red)}
.radd{display:flex;gap:4px}
.radd input{flex:1;min-width:0;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);padding:5px 7px;background:var(--bg);color:var(--text);outline:none}
.radd input:focus{border-color:var(--blue)}
.radd button{display:inline-flex;align-items:center;font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text2);cursor:pointer;flex-shrink:0}
.radd button:hover{background:var(--bg2)}
.stitle{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;margin-top:15px}
.stitle:first-child{margin-top:0}
.idesc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--text2)}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:4px}
.ps-col{background:var(--bg2);border-radius:var(--rl);padding:11px}
.ps-col-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.ps-items{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.ps-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--text)}
.ps-item-name{flex:1}
.ps-xbtn{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;opacity:0;line-height:1;padding:0}
.ps-item:hover .ps-xbtn{opacity:1}.ps-xbtn:hover{color:var(--red)}
.ps-add{display:flex;gap:4px}
.ps-add input{flex:1;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);padding:5px 7px;background:var(--bg);color:var(--text);outline:none}
.ps-add input:focus{border-color:var(--blue)}
.ps-add button{display:inline-flex;align-items:center;font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text2);cursor:pointer}
.ps-add button:hover{background:var(--bg)}
.team-sec{background:var(--bg2);border-radius:var(--rl);padding:13px 15px;margin-bottom:5px}
.tf{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.tf:last-child{margin-bottom:0}
.tfl{font-size:12px;color:var(--text3);width:75px;flex-shrink:0}
.tf select{font-size:13px;border:1px solid var(--border2);border-radius:var(--r);padding:5px 8px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.dev-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dev-chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text2);background:var(--bg)}
.dev-chip button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;line-height:1;padding:0}
.dev-chip button:hover{color:var(--red)}
.dev-add-sel{font-size:12px;border:1px solid var(--border2);border-radius:var(--r);padding:4px 8px;background:var(--bg);color:var(--text2);outline:none;cursor:pointer}
.conn-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 9px;background:var(--bg2);border-radius:var(--r);margin-bottom:3px;flex-wrap:wrap}
.cproj{font-weight:600;color:var(--text)}.citem{color:var(--text2)}
.crel{font-size:10px;padding:2px 5px;border-radius:4px;border:1px solid var(--border);color:var(--text3);background:var(--bg)}
.carr{color:var(--text3);font-size:11px}
.csa{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--green-bg);color:var(--green-text);font-weight:600}
.csp{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--amber-bg);color:var(--amber-text);font-weight:600}
.cdel{background:none;border:none;font-size:12px;color:var(--text3);cursor:pointer;opacity:0;padding:0;margin-left:auto}
.conn-row:hover .cdel{opacity:1}.cdel:hover{color:var(--red)}
.ghdr{padding:14px 18px 13px;border-bottom:1px solid var(--border);flex-shrink:0}
.gtitle{font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px}
.gsub{font-size:13px;color:var(--text2)}
.filter-bar{display:flex;gap:5px;padding:9px 18px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.fbtn{font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--text2);cursor:pointer}
.fbtn:hover{background:var(--bg2)}.fbtn.on{background:var(--bg2);border-color:var(--border2);color:var(--text);font-weight:600}
.scrollbody{flex:1;overflow-y:auto;padding:15px 18px}
.lsec{margin-bottom:17px}
.lhdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.llbl{font-size:14px;font-weight:600;color:var(--text)}
.lcnt{font-size:11px;color:var(--text3);background:var(--bg2);border-radius:999px;padding:1px 6px;border:1px solid var(--border)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:7px}
.lcard{background:var(--bg2);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.lcard:hover{background:var(--bg3)}
.lcard-n{font-size:11px;font-weight:600;color:var(--text);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.05em}
.lcard-cnt{font-size:10px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0}
.litem{font-size:12px;color:var(--text2);padding:2px 0;display:flex;align-items:flex-start;gap:4px;line-height:1.4}
.litem::before{content:"\00B7";color:var(--text3);flex-shrink:0}
.add-conn-form{background:var(--bg2);border-radius:var(--rl);padding:13px 15px;margin-top:3px}
.acr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.acr select,.acr input{font-size:12px;border:1px solid var(--border2);border-radius:var(--r);padding:5px 8px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.stog{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.stog button{font-size:11px;padding:5px 9px;border:none;background:transparent;color:var(--text2);cursor:pointer}
.stog button.on{background:var(--blue);color:#fff}
.acr button.primary{font-size:12px;padding:5px 11px;border:1px solid var(--blue);border-radius:var(--r);background:var(--blue);color:#fff;cursor:pointer;font-weight:600}
.ov-body{flex:1;overflow-y:auto;padding:18px}
.ov-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:3px}
.ov-sub{font-size:13px;color:var(--text2);margin-bottom:18px}
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px}
.sc{background:var(--bg2);border-radius:var(--rl);padding:13px 15px;border:1px solid var(--border)}
.sv{font-size:26px;font-weight:700;color:var(--text);margin-bottom:2px}
.sl{font-size:12px;color:var(--text2)}
.sc.green .sv{color:var(--green)}.sc.blue .sv{color:var(--blue)}.sc.red .sv{color:var(--red)}.sc.amber .sv{color:var(--amber)}
.ov-sec{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px;margin-bottom:20px}
.opc{background:var(--bg2);border-radius:var(--rl);padding:11px 13px;cursor:pointer;border:1px solid var(--border)}
.opc:hover{border-color:var(--border2)}
.opc-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.opc-name{font-size:13px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opc-type{font-size:11px;color:var(--text3);margin-bottom:7px}
.opc-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:4px}
.opc-prog{height:3px;background:var(--bg3);border-radius:999px;margin-top:7px;overflow:hidden}
.opc-pfill{height:100%;background:var(--green);border-radius:999px}
.ov-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.opc-chip{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--border);color:var(--text3)}
.opc-chip.warn{color:var(--amber-text);border-color:var(--amber)}
.eco-wrap{flex:1;overflow:hidden;position:relative;background:var(--bg2)}
.eco-legend{position:absolute;bottom:13px;left:13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;font-size:11px;z-index:10}
.eco-legend-title{font-weight:600;color:var(--text);margin-bottom:6px}
.eco-legend-text{color:var(--text2);margin-bottom:3px}
.eco-lr{display:flex;align-items:center;gap:5px;color:var(--text2);margin-bottom:3px}
.eco-lr:last-child{margin-bottom:0}
.eco-hint{position:absolute;top:13px;right:13px;font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;z-index:10}
.eco-tooltip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;font-size:12px;z-index:20;max-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
.eco-tt-name{font-weight:700;color:var(--text);font-size:13px;margin-bottom:3px}
.eco-tt-type{color:var(--text3);font-size:11px;margin-bottom:6px}
.eco-tt-row{display:flex;gap:7px;font-size:11px;color:var(--text2);margin-bottom:2px}
.eco-tt-key{color:var(--text3);min-width:70px}
.modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px)}
.modal-box{position:relative;background:var(--bg);border-radius:var(--rl);border:1px solid var(--border2);width:100%;max-width:500px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.modal-box.sm{max-width:380px}
.modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:700;color:var(--text)}
.modal-sub{font-size:13px;color:var(--text2);margin-top:2px}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.mfld{margin-bottom:14px}
.mfld:last-child{margin-bottom:0}
.mfld label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.mfld input,.mfld textarea,.mfld select{width:100%;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;background:var(--bg2);color:var(--text);outline:none;font-family:inherit}
.mfld textarea{resize:vertical;min-height:70px;line-height:1.5}
.mfld input:focus,.mfld textarea:focus,.mfld select:focus{border-color:var(--blue)}
.tag-inp-wrap{display:flex;flex-direction:column;gap:6px}
.tag-chips{display:flex;flex-wrap:wrap;gap:5px}
.tag-chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.tag-chip button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;line-height:1;padding:0}
.tag-chip button:hover{color:var(--red)}
.mbtn{font-size:13px;padding:7px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--text2)}
.mbtn:hover{background:var(--bg2)}.mbtn.prim{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.mbtn.prim:hover{opacity:.9}.mbtn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.del-warn{font-size:13px;color:var(--text2);line-height:1.6}.del-warn strong{color:var(--text)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px}

/* ШИНЭЭР НЭМЭГДСЭН ДИЗАЙН */
.user-selector { font-size:12px; padding:5px 10px; border:1px solid var(--border2); border-radius:var(--r); background:var(--bg); color:var(--text); outline:none; font-weight:600; cursor:pointer;}
.ts-meta { font-size:11px; color:var(--text3); margin-top:2px; display:block; font-style:italic;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">NBFI <span>&middot; Product OS</span></span>
    <div class="spacer"></div>
    <span style="font-size:12px; color:var(--text2); font-weight:600;">Active User:</span>
    <select id="current-user" class="user-selector" onchange="window.changeUser(this.value)">
      <option value="Анар">Анар</option>
      <option value="Зул-Эрдэнэ">Зул-Эрдэнэ</option>
      <option value="Халиунаа">Халиунаа</option>
    </select>
    <span style="color:var(--border2)">|</span>
    
    <button class="tbtn prim" onclick="openModal('add-project',{})">+ Add project</button>
    <button class="tbtn" id="team-btn" onclick="toggleTeam()">&#128101; Team</button>
    <button class="tbtn" onclick="exportData()">&#8659; Export JSON</button>
    <button class="tbtn" style="background: var(--bg3); font-weight: 600;" onclick="document.getElementById('json-file-input').click()">&#8657; Import JSON</button>
    <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="importData(event)">
  </div>
  <div class="team-bar" id="team-bar" style="display:none"></div>
  <div class="layout">
    <div class="sb">
      <div class="sb-head"><div class="sb-org">NBFI</div><div class="sb-title">Product OS</div></div>
      <div class="sb-scroll" id="sb-scroll"></div>
      <div class="sb-foot" id="sb-foot"></div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-bg" id="modal-bg"></div>
  <div class="modal-box" id="modal-box"></div>
</div>
<div class="eco-tooltip" id="eco-tt"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAshzmrzmBPPhADwrASmQQAUnTqdnD5MM4",
    authDomain: "omni-products.firebaseapp.com",
    databaseURL: "https://omni-products-default-rtdb.firebaseio.com",
    projectId: "omni-products",
    storageBucket: "omni-products.firebasestorage.app",
    messagingSenderId: "879805024712",
    appId: "1:879805024712:web:9b694019cf8388953998fd",
    measurementId: "G-KQND2ECQ33"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const analytics = getAnalytics(app);
  const dbRef = ref(database, 'product_os_data');

  /* ── UTILS ── */
  window.$ = function(id){return document.getElementById(id);}
  window.esc = function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  window.uid = function(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
  window.toArr = function(v){if(!v)return[];if(Array.isArray(v))return v;if(typeof v==='object')return Object.values(v);return[];}

  /* ── ИДЭВХТЭЙ ХЭРЭГЛЭГЧИЙГ LOCALSTORAGE-Д ХАДГАЛАХ ── */
  window.currentUser = localStorage.getItem('selected_user') || 'Анар';
  document.addEventListener("DOMContentLoaded", () => {
    if($('current-user')) $('current-user').value = window.currentUser;
  });
  window.changeUser = function(val) {
    window.currentUser = val;
    localStorage.setItem('selected_user', val);
  }

  /* ── CONSTANTS ── */
  window.SM={live:{l:'Live',d:'dl',b:'bl'},progress:{l:'In Progress',d:'dp',b:'bp'},bugs:{l:'Has Bugs',d:'db',b:'bb'},planned:{l:'Planned',d:'dpl',b:'bpl'}};
  window.LANES=['now','next','later'];
  window.DEF_ECO={moni:{x:440,y:230},omnipay:{x:285,y:130},'moni-transfer':{x:605,y:130},keep:{x:195,y:310},khurimtlal:{x:195,y:420},los:{x:670,y:310},omnicars:{x:670,y:420},erp:{x:440,y:420},crm:{x:550,y:420}};

  /* ── STATE ── */
  window.D={};
  window.ui={gview:'overview',sel:null,laneInp:{},tab:'tasks',fteam:[]};

  function defaultData(){
    return {
      projects:{},
      tasks:{},
      road:{},
      conns:{},
      eco:JSON.parse(JSON.stringify(window.DEF_ECO)),
      team:{
        'Анар':{role:'Product Owner',leads:[]},
        'Зул-Эрдэнэ':{role:'Developer',leads:[]},
        'Халиунаа':{role:'QA Engineer',leads:[]}
      }
    };
  }

  /* ── DATA OPS ── */
  onValue(dbRef, (snapshot) => {
    const val = snapshot.val();
    if(val) {
      window.D = val;
      if(!window.D.eco) window.D.eco = JSON.parse(JSON.stringify(window.DEF_ECO));
      if(!window.D.team) window.D.team = defaultData().team;
    } else {
      window.D = defaultData();
    }
    window.render();
  });

  window.save = function(){
    set(dbRef, window.D);
  }

  window.exportData = function(){
    const s = JSON.stringify(window.D,null,2);
    const blob = new Blob([s],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nbfi_product_os_data.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  window.importData = function(e){
    const file = e.target.files[0];
    if(!file)return;
    const r = new FileReader();
    r.onload = function(evt){
      try{
        const parsed = JSON.parse(evt.target.result);
        if(parsed && typeof parsed === 'object'){
          window.D = parsed;
          window.save();
          alert('Data imported successfully!');
        } else { alert('Invalid file format.'); }
      }catch(err){alert('Error parsing JSON.');}
    };
    r.readAsText(file);
  }

  /* ── MODALS ── */
  window.openModal = function(type, ctx={}){
    const box = $('modal-box');
    box.className = 'modal-box';
    if(type==='reset'||type==='del-project') box.classList.add('sm');
    box.innerHTML = getModalContent(type, ctx);
    $('modal-overlay').style.display = 'flex';
    
    if(type==='add-project'){
      const tc = $('m_tags_container');
      window.m_tags_list = [];
      window.renderModalTags = () => {
        tc.innerHTML = window.m_tags_list.map((t,i)=>`<span class="tag-chip">${window.esc(t)} <button onclick="window.m_tags_list.splice(${i},1);window.renderModalTags();">&times;</button></span>`).join('');
        $('m_tags').value = window.m_tags_list.join(',');
      };
      $('m_tag_add_btn').onclick = () => {
        const v = $('m_tag_input').value.trim();
        if(v && !window.m_tags_list.includes(v)){
          window.m_tags_list.push(v);
          window.renderModalTags();
        }
        $('m_tag_input').value = '';
      };
    }
  }
  window.closeModal = function(){
    $('modal-overlay').style.display = 'none';
    $('modal-box').innerHTML = '';
  }
  $('modal-bg').onclick = closeModal;

  function getModalContent(type, ctx){
    switch(type){
      case 'add-project':
        return `
          <div class="modal-hdr"><div class="modal-title">New Project</div></div>
          <div class="modal-body">
            <div class="mfld"><label>Project ID (unique, lowercase)</label><input type="text" id="m_id" placeholder="e.g. omnipay"></div>
            <div class="mfld"><label>Project Name</label><input type="text" id="m_name" placeholder="e.g. OmniPay Application"></div>
            <div class="mfld"><label>Localization (Монгол хэл дээрх нэр)</label><input type="text" id="m_local" placeholder="e.g. ОмниПэй Апп"></div>
            <div class="mfld"><label>Type</label>
              <select id="m_type">
                <option value="customer">Customer Facing</option>
                <option value="internal">Internal System</option>
                <option value="core">Core Architecture</option>
              </select>
            </div>
            <div class="mfld"><label>Description</label><textarea id="m_desc" placeholder="Brief info..."></textarea></div>
            <div class="mfld"><label>Tags</label>
              <div class="tag-inp-wrap">
                <div style="display:flex;gap:4px;"><input type="text" id="m_tag_input" placeholder="Add a tag..." style="flex:1"><button class="tbtn" id="m_tag_add_btn" type="button">Add</button></div>
                <div class="tag-chips" id="m_tags_container" style="margin-top:6px;"></div>
                <input type="hidden" id="m_tags">
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="mbtn" onclick="closeModal()">Cancel</button>
            <button class="mbtn prim" onclick="submitAddProject()">Create</button>
          </div>
        `;
      case 'del-project':
        return `
          <div class="modal-hdr"><div class="modal-title" style="color:var(--red-text)">Delete Project</div></div>
          <div class="modal-body">
            <p class="del-warn">Are you sure you want to delete <strong>${window.esc(ctx.name)}</strong>? All connected tasks, roadmaps, and architecture relations will be permanently wiped.</p>
          </div>
          <div class="modal-foot">
            <button class="mbtn" onclick="closeModal()">Cancel</button>
            <button class="mbtn danger" onclick="submitDelProject('${window.esc(ctx.id)}')">Delete Everything</button>
          </div>
        `;
      case 'reset':
        return `
          <div class="modal-hdr">
            <div class="modal-title" style="color: var(--red-text); font-weight: bold; font-size: 17px;">🚨 Баазыг бүрэн форматлах уу?</div>
            <div class="modal-sub" style="margin-top: 4px; color: var(--text-muted);">Энэ үйлдлийг буцаах боломжгүй бөгөөд бүх өгөгдөл устна.</div>
          </div>
          <div class="modal-body" style="padding: 15px 0;">
            <p class="del-warn" style="margin-bottom: 12px; font-weight: 500;">Үргэлжлүүлэхийн тулд хамгаалалтын ПИН кодыг оруулна уу:</p>
            <div class="mfld" style="display: flex; justify-content: center;">
              <input type="password" id="reset-pin" placeholder="ПИН код" maxlength="6" style="text-align:center; font-size:18px; letter-spacing:6px; padding:8px; width:60%;">
            </div>
          </div>
          <div class="modal-foot">
            <button class="mbtn" onclick="closeModal()">Цуцлах</button>
            <button class="mbtn danger" onclick="submitReset()">Тийм, бүгдийг устга</button>
          </div>
        `;
    }
    return '';
  }

  window.submitAddProject = function(){
    const id=(($('m_id')?$('m_id').value:'').trim().toLowerCase());const name=(($('m_name')?$('m_name').value:'').trim());const local=(($('m_local')?$('m_local').value:'').trim());
    const type=$('m_type')?$('m_type').value:'customer';const desc=(($('m_desc')?$('m_desc').value:'').trim());const tagsInp=$('m_tags')?$('m_tags').value:'';
    if(!id||!name){alert('ID and Name required.');return;}
    const tags=tagsInp.split(',').map(t=>t.trim()).filter(t=>t);
    if(!window.D.projects)window.D.projects={};window.D.projects[id]={id,name,local,type,status:'planned',desc,tags};
    window.ui.sel=id;window.ui.gview='project';window.save();window.closeModal();window.render();
  }
  window.submitDelProject = function(pid){
    if(window.D.projects[pid])delete window.D.projects[pid];
    Object.values(window.D.tasks||{}).forEach(t=>{if(t.p===pid)delete window.D.tasks[t.id];});
    Object.values(window.D.road||{}).forEach(r=>{if(r.p===pid)delete window.D.road[r.id];});
    Object.values(window.D.conns||{}).forEach(c=>{if(c.fp===pid||c.tp===pid)delete window.D.conns[c.id];});
    window.ui.sel=null;window.ui.gview='overview';window.save();window.closeModal();window.render();
  }
  
  window.submitReset = function(){
    const pinInput = document.getElementById('reset-pin');
    const userPin = pinInput ? pinInput.value.trim() : '';
    const SECURITY_PIN = '9911'; 
    
    if (userPin === '') {
      alert('❌ Хамгаалалтын ПИН кодыг оруулна уу!');
      if(pinInput) pinInput.focus();
      return;
    }
    
    if (userPin !== SECURITY_PIN) {
      alert('❌ Хамгаалалтын ПИН код буруу байна! Систем форматлах үйлдлийг цуцаллаа.');
      if(pinInput) { pinInput.value = ''; pinInput.focus(); }
      return;
    }
    
    console.log('⚠️ Устгахаас өмнө автомат backup хийж байна...');
    try {
      const backupData = JSON.stringify(window.D || {}, null, 2);
      const blob = new Blob([backupData], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AUTO_BACKUP_BEFORE_RESET_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('Автомат backup хийхэд алдаа гарлаа:', err);
    }

    window.D = defaultData();
    window.save();
    window.closeModal();
    window.render();
    alert('✅ Баазыг амжилттай форматлалаа. Хуучин датаг файл хэлбэрээр автоматаар татаж авсан тул шаардлагатай бол буцааж импортлох боломжтой.');
  }

  /* ── TEAM MGMT ── */
  window.toggleTeam = function(){
    const b = $('team-bar');
    if(b.style.display==='none'){b.style.display='flex';window.renderTeamBar();}
    else{b.style.display='none';}
    $('team-btn').classList.toggle('on');
  }
  window.renderTeamBar = function(){
    const b = $('team-bar');if(!b)return;
    if(b.style.display==='none')return;
    let h = `<div class="tlbl">Team Assignment Filters:</div>`;
    Object.keys(window.D.team||{}).forEach(name=>{
      const active = window.ui.fteam.includes(name);
      h += `<button class="fbtn ${active?'on':''}" onclick="window.toggleTeamFilter('${window.esc(name)}')">${window.esc(name)}</button>`;
    });
    b.innerHTML = h;
  }
  window.toggleTeamFilter = function(name){
    const idx = window.ui.fteam.indexOf(name);
    if(idx===-1)window.ui.fteam.push(name);else window.ui.fteam.splice(idx,1);
    window.renderTeamBar();window.render();
  }

  /* ── VIEW ROUTING ── */
  window.setView = function(v,sel=null){
    window.ui.gview=v;window.ui.sel=sel;window.render();
  }

  /* ── CORE RENDERER ── */
  window.render = function(){
    renderSidebar();
    if(window.ui.gview==='overview') renderOverview();
    else if(window.ui.gview==='roadmap') renderGlobalRoadmap();
    else if(window.ui.gview==='eco') renderEcosystemGraph();
    else if(window.ui.gview==='project') renderProjectView();
  }

  function renderSidebar(){
    const scr = $('sb-scroll');if(!scr)return;
    let h = `
      <div class="gbtn ${window.ui.gview==='overview'?'on':''}" onclick="setView('overview')">&#128202; Overview</div>
      <div class="gbtn ${window.ui.gview==='roadmap'?'on':''}" onclick="setView('roadmap')">&#128474; Master Roadmap</div>
      <div class="gbtn ${window.ui.gview==='eco'?'on':''}" onclick="setView('eco')">&#127183; Eco Relations</div>
      <div class="sb-sec"><span>Projects</span></div>
    `;
    const projs = window.toArr(window.D.projects);
    projs.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    projs.forEach(p=>{
      const active = (window.ui.gview==='project' && window.ui.sel===p.id);
      const m = window.SM[p.status||'planned']||window.SM.planned;
      const tks = window.toArr(window.D.tasks).filter(t=>t.p===p.id);
      const done = tks.filter(t=>t.dn).length;
      h += `
        <div class="pitem ${active?'on':''}" onclick="setView('project','${p.id}')">
          <div class="dot ${m.d}"></div>
          <div class="pname" title="${window.esc(p.name)}">${window.esc(p.name)}</div>
          <div class="pitem-act">
            <button class="piabtn del" onclick="event.stopPropagation();openModal('del-project',{id:'${p.id}',name:'${p.name}'})">&times;</button>
          </div>
          ${tks.length?`<div class="pcnt">${done}/${tks.length}</div>`:''}
        </div>
      `;
    });
    scr.innerHTML = h;
    $('sb-foot').innerHTML = `<button class="gbtn" style="width:100%;color:var(--red-text)" onclick="openModal('reset')">&#9888; Reset Database</button>`;
  }

  function renderOverview(){
    const main = $('main');
    const projs = window.toArr(window.D.projects);
    const tks = window.toArr(window.D.tasks);
    let totalT = tks.length, doneT = tks.filter(t=>t.dn).length;
    let liveC=0, progC=0, bugC=0, planC=0;
    projs.forEach(p=>{
      if(p.status==='live')liveC++;
      else if(p.status==='progress')progC++;
      else if(p.status==='bugs')bugC++;
      else planC++;
    });
    let filteredProjs = projs;
    if(window.ui.fteam.length>0){
      filteredProjs = projs.filter(p=>{
        const pts = window.toArr(window.D.road).filter(r=>r.p===p.id);
        let match = false;
        pts.forEach(pt=>{
          const devs = window.toArr(pt.devs);
          if(devs.some(d=>window.ui.fteam.includes(d))) match = true;
          if(window.ui.fteam.includes(pt.owner)) match = true;
          if(window.ui.fteam.includes(pt.qa)) match = true;
        });
        return match;
      });
    }
    let h = `
      <div class="ov-body">
        <div class="ov-title">Product Portfolio Overview</div>
        <div class="ov-sub">NBFI Systems &amp; Strategic Operations Core Control</div>
        <div class="ov-stats">
          <div class="sc green"><div class="sv">${liveC}</div><div class="sl">Live Systems</div></div>
          <div class="sc blue"><div class="sv">${progC}</div><div class="sl">In Production</div></div>
          <div class="sc red"><div class="sv">${bugC}</div><div class="sl">With Critical Bugs</div></div>
          <div class="sc amber"><div class="sv">${planC}</div><div class="sl">Planned / Backlog</div></div>
        </div>
        <div class="ov-sec">${window.ui.fteam.length?'Filtered Portfolio':'Full Portfolio'} (${filteredProjs.length} systems)</div>
        <div class="ov-grid">
    `;
    filteredProjs.forEach(p=>{
      const m = window.SM[p.status||'planned']||window.SM.planned;
      const ptks = tks.filter(t=>t.p===p.id);
      const pdone = ptks.filter(t=>t.dn).length;
      const pct = ptks.length ? Math.round((pdone/ptks.length)*100) : 0;
      h += `
        <div class="opc" onclick="setView('project','${p.id}')">
          <div class="opc-top">
            <div class="dot ${m.d}"></div>
            <div class="opc-name">${window.esc(p.name)}</div>
          </div>
          <div class="opc-type">${window.esc(p.local || p.id)} &middot; <span style="text-transform:capitalize">${p.type||'customer'}</span></div>
          <div class="opc-prog"><div class="opc-pfill" style="width:${pct}%"></div></div>
          <div class="opc-row"><span>Tasks Progress</span><span>${pct}% (${pdone}/${ptks.length})</span></div>
        </div>
      `;
    });
    if(!filteredProjs.length) h+= `<div class="muted" style="grid-column:1/-1">No systems matched current team filters.</div>`;
    h += `</div></div>`;
    main.innerHTML = h;
  }

  function renderGlobalRoadmap(){
    const main = $('main');
    let h = `
      <div class="ghdr">
        <div class="gtitle">Master Roadmap Matrix</div>
        <div class="gsub">Cross-Project Delivery Streams Across Execution Horizons</div>
      </div>
      <div class="scrollbody">
    `;
    window.LANES.forEach(lane=>{
      const items = window.toArr(window.D.road).filter(r=>r.lane===lane);
      let filtered = items;
      if(window.ui.fteam.length>0){
        filtered = items.filter(r=>{
          if(window.ui.fteam.includes(r.owner))return true;
          if(window.ui.fteam.includes(r.qa))return true;
          if(window.toArr(r.devs).some(d=>window.ui.fteam.includes(d)))return true;
          return false;
        });
      }
      h += `
        <div class="lsec">
          <div class="lhdr"><span class="llbl" style="text-transform:uppercase">${lane}</span><span class="lcnt">${filtered.length}</span></div>
          <div class="lgrid">
      `;
      filtered.forEach(r=>{
        const proj = window.D.projects[r.p] || {name:r.p};
        h += `
          <div class="lcard" onclick="setView('project','${r.p}')">
            <div class="lcard-n">${window.esc(r.title)}<span class="lcard-cnt">${window.esc(proj.name)}</span></div>
            ${r.owner?`<div class="litem"><span style="color:var(--text3)">Owner:</span>&nbsp;${window.esc(r.owner)}</div>`:''}
            ${window.toArr(r.devs).length?`<div class="litem"><span style="color:var(--text3)">Dev:</span>&nbsp;${window.toArr(r.devs).join(', ')}</div>`:''}
            ${r.qa?`<div class="litem"><span style="color:var(--text3)">QA:</span>&nbsp;${window.esc(r.qa)}</div>`:''}
          </div>
        `;
      });
      if(!filtered.length) h+= `<div class="muted">Horizon empty or filtered out.</div>`;
      h += `</div></div>`;
    });
    h += `</div>`;
    main.innerHTML = h;
  }

  function renderEcosystemGraph(){
    const main = $('main');
    let h = `
      <div class="ghdr">
        <div class="gtitle">System Architecture Ecosystem</div>
        <div class="gsub">Interdependency Engine, Pipeline Links, &amp; Downstream Graphs</div>
      </div>
      <div class="eco-wrap" id="eco-wrap">
        <div class="eco-legend">
          <div class="eco-legend-title">System Topology Legend</div>
          <div class="eco-lr"><div class="dot dl"></div> Live Infrastructure</div>
          <div class="eco-lr"><div class="dot dp"></div> Heavy Production</div>
          <div class="eco-lr"><div class="dot dpl"></div> Backlog Pipeline</div>
          <div class="eco-lr"><div class="dot db"></div> Operational Blockers</div>
        </div>
        <div class="eco-hint">Drag nodes around to reconstruct corporate architecture layout mapping.</div>
        <svg id="eco-svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1"></svg>
    `;
    const projs = window.toArr(window.D.projects);
    projs.forEach(p=>{
      const m = window.SM[p.status||'planned']||window.SM.planned;
      const pos = window.D.eco[p.id] || {x:100,y:100};
      h += `
        <div class="bdg ${m.b}" id="node-${p.id}" style="position:absolute;left:${pos.x}px;top:${pos.y}px;z-index:5;transform:translate(-50%,-50%);user-select:none;padding:6px 12px;border:1px solid var(--border2);box-shadow:0 2px 6px rgba(0,0,0,0.06)"
             onmousedown="window.dragNode(event,'${p.id}')" onclick="window.nodeClick(event,'${p.id}')">
          <div class="dot ${m.d}"></div><strong>${window.esc(p.name)}</strong>
        </div>
      `;
    });
    h += `</div>`;
    main.innerHTML = h;
    setTimeout(drawEcoLines, 50);
  }

  window.nodeClick = function(e, pid){
    if(window.eco_dragged)return;
    setView('project', pid);
  }

  window.dragNode = function(e, pid){
    e.preventDefault();
    window.eco_dragged = false;
    const n = $('node-'+pid);
    const wrap = $('eco-wrap');
    const rect = wrap.getBoundingClientRect();
    let startX = e.clientX, startY = e.clientY;
    let currX = window.D.eco[pid].x, currY = window.D.eco[pid].y;
    
    function mm(ev){
      window.eco_dragged = true;
      let dx = ev.clientX - startX, dy = ev.clientY - startY;
      let nx = currX + dx, ny = currY + dy;
      if(nx<40)nx=40;if(nx>rect.width-40)nx=rect.width-40;
      if(ny<40)ny=40;if(ny>rect.height-40)ny=rect.height-40;
      n.style.left = nx+'px';n.style.top = ny+'px';
      window.D.eco[pid].x = nx;window.D.eco[pid].y = ny;
      drawEcoLines();
    }
    function mu(){
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
      if(window.eco_dragged) window.save();
    }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  }

  function drawEcoLines(){
    const svg = $('eco-svg');if(!svg)return;
    const wrap = $('eco-wrap');if(!wrap)return;
    svg.innerHTML = '';
    const conns = window.toArr(window.D.conns);
    conns.forEach(c=>{
      const from = window.D.eco[c.fp];const to = window.D.eco[c.tp];
      if(!from || !to)return;
      const active = window.ui.sel === c.id;
      
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', from.x);line.setAttribute('y1', from.y);
      line.setAttribute('x2', to.x);line.setAttribute('y2', to.y);
      line.setAttribute('stroke', c.rel==='blocked'?'var(--red)':'var(--text3)');
      line.setAttribute('stroke-width', active?'3':'1.5');
      if(c.rel==='blocked') line.setAttribute('stroke-dasharray', '4,4');
      svg.appendChild(line);
      
      const mx = (from.x+to.x)/2, my = (from.y+to.y)/2;
      const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x', mx);txt.setAttribute('y', my-4);
      txt.setAttribute('fill', 'var(--text2)');txt.setAttribute('font-size', '9px');
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-weight', '600');
      txt.textContent = c.rel==='blocked'?'BLOCKED':'DEPENDS';
      svg.appendChild(txt);
    });
  }

  function renderProjectView(){
    const main = $('main');const pid = window.ui.sel;
    const p = window.D.projects[pid];
    if(!p){setView('overview');return;}
    const m = window.SM[p.status||'planned']||window.SM.planned;
    let h = `
      <div class="phdr">
        <div class="ptrow">
          <span class="pt">${window.esc(p.name)}</span>
          <span class="plocal">(${window.esc(p.local || 'No Localization')})</span>
          <span class="bdg ${m.b}" id="pstatus-bdg" onclick="window.toggleStatusMenu(event)">
            <div class="dot ${m.d}"></div><span>${m.l}</span> &#9662;
            <div class="smenu" id="pstatus-menu" style="display:none">
              <div class="sopt" onclick="window.setProjStatus('${p.id}','live')"><div class="dot dl"></div>Live</div>
              <div class="sopt" onclick="window.setProjStatus('${p.id}','progress')"><div class="dot dp"></div>In Progress</div>
              <div class="sopt" onclick="window.setProjStatus('${p.id}','bugs')"><div class="dot db"></div>Has Bugs</div>
              <div class="sopt" onclick="window.setProjStatus('${p.id}','planned')"><div class="dot dpl"></div>Planned</div>
            </div>
          </span>
          <span class="ptype">System class: <strong style="text-transform:uppercase">${p.type||'customer'}</strong></span>
        </div>
        <div class="pmeta-row">
          <div class="pmeta-g"><span class="pmeta-l">System ID:</span><span class="pmeta-v">${p.id}</span></div>
          <div class="pmeta-sep"></div>
          <div class="pmeta-g"><span class="pmeta-l">Tags:</span> ${p.tags&&p.tags.length?p.tags.map(t=>`<span class="pmeta-c">${window.esc(t)}</span>`).join(''):'<span class="pmeta-v" style="color:var(--text3)">None</span>'}</div>
        </div>
        <div class="tabs">
          <div class="tab ${window.ui.tab==='tasks'?'on':''}" onclick="window.setTab('tasks')">&#9745; Tactical Tasks</div>
          <div class="tab ${window.ui.tab==='road'?'on':''}" onclick="window.setTab('road')">&#128474; Roadmap Streams</div>
          <div class="tab ${window.ui.tab==='conns'?'on':''}" onclick="window.setTab('conns')">&#127183; Architecture Matrix</div>
          <div class="tab ${window.ui.tab==='info'?'on':''}" onclick="window.setTab('info')">&#128214; Metadata Info</div>
        </div>
      </div>
      <div class="mbody">
    `;
    if(window.ui.tab==='tasks') h += renderProjTasks(p);
    else if(window.ui.tab==='road') h += renderProjRoad(p);
    else if(window.ui.tab==='conns') h += renderProjConns(p);
    else if(window.ui.tab==='info') h += renderProjInfo(p);
    h += `</div>`;
    main.innerHTML = h;
  }

  window.setTab = function(t){window.ui.tab=t;window.render();}
  window.toggleStatusMenu = function(e){
    e.stopPropagation();const m = $('pstatus-menu');
    m.style.display = m.style.display==='none'?'block':'none';
    const cl = () => { m.style.display='none'; document.removeEventListener('click',cl); };
    document.addEventListener('click',cl);
  }
  window.setProjStatus = function(pid,st){
    if(window.D.projects[pid])window.D.projects[pid].status=st;
    window.save();window.render();
  }

  function renderProjTasks(p){
    const items = window.toArr(window.D.tasks).filter(t=>t.p===p.id);
    const active = items.filter(t=>!t.dn);const done = items.filter(t=>t.dn);
    const pct = items.length ? Math.round((done.length/items.length)*100) : 0;
    
    let h = `
      <div class="tmeta"><span>Tactical Implementation Backlog</span><span>${pct}% complete (${done.length}/${items.length} tasks)</span></div>
      <div class="prog"><div class="pfill" style="width:${pct}%"></div></div>
      <div class="ar">
        <input type="text" id="add-task-txt" placeholder="Describe scope definition..." onkeydown="if(event.key==='Enter')window.addTask('${p.id}')">
        <select id="add-task-lane"><option value="now">⚡ Now</option><option value="next">⏳ Next</option><option value="later">📋 Later</option></select>
        <button onclick="window.addTask('${p.id}')">Add Scope</button>
      </div>
      <div class="stitle">Active Sprints</div>
      <div class="tlist">
    `;
    active.forEach(t=>{
      h += `
        <div class="titem">
          <div class="chk" onclick="window.toggleTask('${t.id}')"></div>
          <div class="ttxt">${window.esc(t.txt)}</div>
          <span class="atag" style="text-transform:uppercase">${t.lane||'now'}</span>
          <button class="xbtn" onclick="window.delTask('${t.id}')">&times;</button>
        </div>
      `;
    });
    if(!active.length) h+= `<div class="muted">No active tactical scopes specified. All clean.</div>`;
    h += `</div>`;
    if(done.length){
      h += `<div class="donesec"><div class="dnhdr">Archived Definition of Done</div><div class="tlist">`;
      done.forEach(t=>{
        h += `
          <div class="titem">
            <div class="chk ck" onclick="window.toggleTask('${t.id}')"></div>
            <div class="ttxt dn">${window.esc(t.txt)}</div>
            <button class="xbtn" onclick="window.delTask('${t.id}')">&times;</button>
          </div>
        `;
      });
      h += `</div></div>`;
    }
    return h;
  }

  window.addTask = function(pid){
    const txt = $('add-task-txt').value.trim();
    const lane = $('add-task-lane').value;
    if(!txt)return;
    const tid = window.uid();
    if(!window.D.tasks)window.D.tasks={};
    window.D.tasks[tid] = {id:tid,p:pid,txt,lane,dn:false};
    window.save();window.render();
  }
  window.toggleTask = function(tid){
    if(window.D.tasks[tid])window.D.tasks[tid].dn = !window.D.tasks[tid].dn;
    window.save();window.render();
  }
  window.delTask = function(tid){
    if(window.D.tasks[tid])delete window.D.tasks[tid];
    window.save();window.render();
  }

  function renderProjRoad(p){
    const items = window.toArr(window.D.road).filter(r=>r.p===p.id);
    let h = `<div class="rcols">`;
    window.LANES.forEach(lane=>{
      const laneItems = items.filter(r=>r.lane===lane);
      h += `
        <div class="rcol">
          <div class="rch"><span class="rct" style="text-transform:uppercase">${lane}</span><span class="rcc">${laneItems.length}</span></div>
          <div class="rlist">
      `;
      laneItems.forEach(r=>{
        let devStr = window.toArr(r.devs).join(', ');
        h += `
          <div class="rcard">
            <div class="rcard-t">
              <strong>${window.esc(r.title)}</strong>
              ${r.owner||devStr||r.qa?`<span class="ts-meta">P: ${window.esc(r.owner||'-')} | D: ${window.esc(devStr||'-')} | Q: ${window.esc(r.qa||'-')}</span>`:''}
            </div>
            <button class="mvb" onclick="window.moveRoad('${r.id}','${lane}')">&#8646;</button>
            <button class="rxb" onclick="window.delRoad('${r.id}')">&times;</button>
          </div>
        `;
      });
      h += `
          </div>
          <div class="radd">
            <input type="text" id="radd-txt-${lane}" placeholder="Delivery item..." onkeydown="if(event.key==='Enter')window.addRoad('${p.id}','${lane}')">
            <button onclick="window.addRoad('${p.id}','${lane}')">+</button>
          </div>
        </div>
      `;
    });
    h += `</div>`;
    
    // БҮРЭН БҮРЭЛДЭХҮҮНИЙ ДАРААХ СЕКЦ: ХӨГЖҮҮЛЭЛТИЙН БАГ ХУВААРИЛАЛТ
    h += `
      <div class="stitle" style="margin-top:20px">&#128101; Stream Engineering Resource Assignment</div>
      <div class="team-sec">
    `;
    if(items.length===0){
      h += `<div class="muted">Эхлээд дээрх хоризонуудад хүргэлтийн элемент нэмээд, дараа нь энд багаа хуваарилаарай.</div>`;
    } else {
      items.forEach(r=>{
        h += `
          <div class="tf">
            <div class="tfl" style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${window.esc(r.title)}">${window.esc(r.title)}:</div>
            
            <div style="display:flex; align-items:center; gap:4px;">
              <span style="font-size:11px; color:var(--text3)">Owner:</span>
              <select onchange="window.assignRole('${r.id}','owner',this.value)">
                <option value="">-- None --</option>
                ${Object.keys(window.D.team||{}).map(n=>`<option value="${n}" ${r.owner===n?'selected':''}>${n}</option>`).join('')}
              </select>
            </div>
            
            <div style="display:flex; align-items:center; gap:4px; flex:1; margin-left:10px;">
              <span style="font-size:11px; color:var(--text3)">Devs:</span>
              <div class="dev-chips">
                ${window.toArr(r.devs).map(d=>`<span class="dev-chip">${window.esc(d)} <button onclick="window.removeDev('${r.id}','${d}')">&times;</button></span>`).join('')}
                <select class="dev-add-sel" onchange="window.addDev('${r.id}',this.value); this.value='';">
                  <option value="">+ Add</option>
                  ${Object.keys(window.D.team||{}).filter(n=>!window.toArr(r.devs).includes(n)).map(n=>`<option value="${n}">${n}</option>`).join('')}
                </select>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:4px; margin-left:10px;">
              <span style="font-size:11px; color:var(--text3)">QA:</span>
              <select onchange="window.assignRole('${r.id}','qa',this.value)">
                <option value="">-- None --</option>
                ${Object.keys(window.D.team||{}).map(n=>`<option value="${n}" ${r.qa===n?'selected':''}>${n}</option>`).join('')}
              </select>
            </div>
          </div>
        `;
      });
    }
    h += `</div>`;
    return h;
  }

  window.addRoad = function(pid,lane){
    const txt = $('radd-txt-'+lane).value.trim();if(!txt)return;
    const rid = window.uid();
    if(!window.D.road)window.D.road={};
    window.D.road[rid] = {id:rid,p:pid,title:txt,lane,devs:[],owner:'',qa:''};
    window.save();window.render();
  }
  window.delRoad = function(rid){
    if(window.D.road[rid])delete window.D.road[rid];
    window.save();window.render();
  }
  window.moveRoad = function(rid,clane){
    const r = window.D.road[rid];if(!r)return;
    let idx = window.LANES.indexOf(clane);
    idx = (idx+1)%window.LANES.length;
    r.lane = window.LANES[idx];
    window.save();window.render();
  }
  window.assignRole = function(rid, field, value){
    if(window.D.road[rid]) window.D.road[rid][field] = value;
    window.save(); window.render();
  }
  window.addDev = function(rid, dev){
    if(!dev)return;
    if(window.D.road[rid]){
      if(!window.D.road[rid].devs) window.D.road[rid].devs = [];
      if(!window.D.road[rid].devs.includes(dev)) window.D.road[rid].devs.push(dev);
      window.save(); window.render();
    }
  }
  window.removeDev = function(rid, dev){
    if(window.D.road[rid] && window.D.road[rid].devs){
      window.D.road[rid].devs = window.D.road[rid].devs.filter(d=>d!==dev);
      window.save(); window.render();
    }
  }

  function renderProjConns(p){
    const conns = window.toArr(window.D.conns).filter(c=>c.fp===p.id || c.tp===p.id);
    const projs = window.toArr(window.D.projects).filter(pr=>pr.id!==p.id);
    let h = `
      <div class="stitle">System Topology Interdependencies</div>
      <div class="tlist" style="margin-bottom:12px">
    `;
    conns.forEach(c=>{
      const isFrom = c.fp === p.id;
      const targetId = isFrom ? c.tp : c.fp;
      const target = window.D.projects[targetId] || {name:targetId};
      const rbdg = c.rel==='blocked'?`<span class="csp">BLOCKED</span>` : `<span class="csa">DEPENDS</span>`;
      h += `
        <div class="conn-row">
          ${isFrom ? `<strong>This system</strong> <span class="carr">&rarr;</span> ${rbdg} on <span class="cproj">${window.esc(target.name)}</span>` : 
                     `<span class="cproj">${window.esc(target.name)}</span> <span class="carr">&rarr;</span> ${rbdg} on <strong>This system</strong>`}
          <button class="cdel" onclick="window.delConn('${c.id}')">&times;</button>
        </div>
      `;
    });
    if(!conns.length) h+= `<div class="muted">Architectural graph decoupled. No microservice connections mapped.</div>`;
    h += `</div>`;
    
    h += `
      <div class="stitle">Map New Network Edge</div>
      <div class="add-conn-form">
        <div class="acr">
          <select id="conn-dir"><option value="out">This project depends on &rarr;</option><option value="in">Is required upstream by &larr;</option></select>
          <select id="conn-target">
            ${projs.map(pr=>`<option value="${pr.id}">${window.esc(pr.name)}</option>`).join('')}
          </select>
          <span style="font-size:12px;color:var(--text2)">Status:</span>
          <div class="stog" id="conn-rel-tog"><button class="on" id="rel-dep" onclick="window.setConnRel('depends')">Depends</button><button id="rel-blk" onclick="window.setConnRel('blocked')">Blocked</button></div>
          <button class="primary" onclick="window.addConn('${p.id}')">Bind Edge</button>
        </div>
      </div>
    `;
    window.ui.addConnRel = 'depends';
    return h;
  }

  window.setConnRel = function(r){
    window.ui.addConnRel = r;
    $('rel-dep').classList.toggle('on', r==='depends');
    $('rel-blk').classList.toggle('on', r==='blocked');
  }
  window.addConn = function(pid){
    const dir = $('conn-dir').value;
    const target = $('conn-target').value;
    if(!target)return;
    const cid = window.uid();
    const fp = dir==='out'?pid:target;
    const tp = dir==='out'?target:pid;
    if(!window.D.conns)window.D.conns={};
    window.D.conns[cid] = {id:cid,fp,tp,rel:window.ui.addConnRel};
    window.save();window.render();
  }
  window.delConn = function(cid){
    if(window.D.conns[cid])delete window.D.conns[cid];
    window.save();window.render();
  }

  function renderProjInfo(p){
    return `
      <div class="stitle">System Scope Definition</div>
      <div class="idesc">${p.desc?window.esc(p.desc).replace(/\n/g,'<br>'):'<span style="color:var(--text3)">No specifications declared for this core node. Input values inside structural templates.</span>'}</div>
      <div class="ar" style="margin-top:15px;gap:4px;">
        <button onclick="window.editProjDesc('${p.id}')">&#9998; Rewrite Definition</button>
      </div>
    `;
  }

  window.editProjDesc = function(pid){
    const p = window.D.projects[pid];if(!p)return;
    const n = prompt('Edit description scope for '+p.name+':', p.desc||'');
    if(n!==null){
      p.desc = n.trim();
      window.save();window.render();
    }
  }

  window.render();
</script>
</body>
</html>
